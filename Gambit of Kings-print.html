<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Abyssal Gambit — Print</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  /* Reset for print-stack layout */
  html, body { overflow: visible !important; background: #000; margin:0; padding:0; }
  .stage { position: static !important; background: #000; display: block; padding: 32px 0; }

  /* Each screen sits on its own page, fixed at the 1440×900 design size */
  .print-page {
    width: 1440px;
    height: 900px;
    position: relative;
    margin: 0 auto 32px;
    background: var(--abyss-1);
    box-shadow: 0 0 0 1px oklch(0.06 0.015 220), 0 30px 80px rgba(0,0,0,0.9);
    overflow: hidden;
    page-break-after: always;
    break-after: page;
  }
  .print-page:last-child { page-break-after: auto; break-after: auto; }

  /* Tag plate — shows screen name on-page for reference */
  .print-label {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 50;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--brass-dim);
    background: rgba(0,0,0,0.6);
    border: 1px solid var(--brass-deep);
    padding: 4px 12px;
    pointer-events: none;
  }

  /* The screens use position:absolute inset:0 — keep that working by giving each
     a positioned container the exact design size. */
  .print-page > .screen-host {
    position: absolute; inset: 0;
  }

  /* Disable all animations for print stability */
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-delay: 0ms !important;
    transition: none !important;
  }

  /* Print rules */
  @page {
    size: 1440px 900px;
    margin: 0;
  }
  @media print {
    html, body { background: #000 !important; }
    .stage { padding: 0 !important; }
    .print-page {
      margin: 0 !important;
      box-shadow: none !important;
      page-break-after: always;
      break-after: page;
    }
    .print-page:last-child { page-break-after: auto; break-after: auto; }
    /* Force background colors/gradients to print */
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
    }
    /* No scale of the frame in print */
  }
</style>
</head>
<body>

<div class="stage">
  <div id="root"></div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js?v=3"></script>
<script src="map.js?v=3"></script>

<script type="text/babel" src="screens/MainMenu.jsx"></script>
<script type="text/babel" src="screens/ObjectiveIcon.jsx"></script>
<script type="text/babel" src="screens/WorldMap.jsx"></script>
<script type="text/babel" src="screens/NodePreview.jsx"></script>
<script type="text/babel" src="screens/Match.jsx"></script>
<script type="text/babel" src="screens/RewardShop.jsx"></script>
<script type="text/babel" src="screens/Inventory.jsx"></script>

<script type="text/babel">
(function() {
  const noop = () => {};

  // Build a representative run that exercises visuals nicely
  function makeRun() {
    const cls = (window.CLASSES && window.CLASSES[0]) || {
      name:'Brood of the Deep', glyph:'♛', startHp:7, startGold:80, deck:['K','Q','R','R','B','B','N','N','P','P','P','P','P','P','P','P']
    };
    const relics = (window.RELICS || []).slice(0, 3);
    return {
      cls,
      hp: Math.max(1, cls.startHp - 2),
      hpMax: cls.startHp,
      gold: 124,
      deck: [...cls.deck],
      relics: relics.length ? relics : [
        { name:'Tidal Locket', glyph:'◈', desc:'Once per hunt, resurrect a fallen pawn as a knight.' },
        { name:'Coral Crown',  glyph:'♛', desc:'Sovereign gains +1 reach on the first move of every hunt.' },
        { name:'Siltbound Tome', glyph:'✦', desc:'Reveal the next hunt\'s currents before descent.' },
      ],
      mapSeed: 4242,
      currentNode: 'a1-03',
      visited: ['a1-01', 'a1-02'],
      floor: 0,
      assignmentIdx: 0,
      currentNodeIdx: 3,
    };
  }

  // Pick a representative node + enemy for NodePreview / Match / Reward
  function firstAvailableNode(run) {
    const a = window.getAssignment(run.assignmentIdx || 0);
    const i = run.currentNodeIdx || 0;
    const n = a.nodes[i];
    return { ...n, type: n.obj === 'purge' ? 'boss' : 'combat', row: 0, assignmentIdx: run.assignmentIdx || 0, idx: i };
  }
  function pickEnemy(node) {
    const pool = node.type === 'boss' ? window.ENEMIES.boss : window.ENEMIES.combat;
    return pool[0];
  }

  const { createElement: h } = React;

  const Page = ({ label, children }) => (
    <div className="print-page vignette">
      <div className="print-label">{label}</div>
      <div className="screen-host">{children}</div>
    </div>
  );

  const PrintAll = () => {
    const run = React.useMemo(makeRun, []);
    const node = React.useMemo(() => firstAvailableNode(run), [run]);
    const enemy = React.useMemo(() => pickEnemy(node), [node]);

    return (
      <>
        <Page label="01 · Main Menu">
          <MainMenu go={noop}/>
        </Page>

        <Page label="02 · World Map · The Silted Mouth">
          <WorldMap go={noop} run={run} setRun={noop} openNode={noop}/>
        </Page>

        <Page label="03 · Node Preview (modal)">
          {/* Render the map behind the modal so the backdrop has context */}
          <WorldMap go={noop} run={run} setRun={noop} openNode={noop}/>
          <NodePreview node={node} run={run} onClose={noop} onEnter={noop}/>
        </Page>

        <Page label="05 · Match — The Hunt">
          <Match run={run} enemy={enemy} node={node} boardSize={8} onWin={noop} onLose={noop}/>
        </Page>

        <Page label="06 · Reward — Spoils of the Tide">
          <Reward run={run} node={node} enemy={enemy} onClaim={noop}/>
        </Page>

        <Page label="07 · Shop">
          <Shop run={run} onClose={noop} onBuy={noop}/>
        </Page>

        <Page label="08 · Reliquary (Inventory)">
          <Inventory run={run} onClose={noop}/>
        </Page>

        <Page label="09 · Victory — All Tides Claimed">
          <GameOver won={true} run={run} onAgain={noop} onMenu={noop}/>
        </Page>

        <Page label="10 · Defeat — Dragged to the Deep">
          <GameOver won={false} run={run} onAgain={noop} onMenu={noop}/>
        </Page>
      </>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(<PrintAll/>);

  // Auto-print once fonts + JSX have rendered
  async function autoPrint() {
    try {
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }
    } catch (e) {}
    // Let React render all pages
    await new Promise(r => setTimeout(r, 1200));
    window.print();
  }
  // Auto-print on load — user can Cmd/Ctrl+P again if they dismiss.
  window.addEventListener('load', () => { setTimeout(autoPrint, 400); });
})();
</script>

</body>
</html>
